<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok AI Factory</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: Arial, sans-serif;
    }

    #stage {
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 35%, #16213e 0%, #050505 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .content {
      padding: 80px;
    }

    h1 {
      margin: 0;
      font-size: 110px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -5px;
    }

    p {
      margin-top: 35px;
      font-size: 44px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div
    id="stage"
    data-composition-id="tiktok-main"
    data-start="0"
    data-duration="3"
    data-width="1080"
    data-height="1920"
    data-no-timeline
  >
    <div class="content">
      <h1>AI FACTORY</h1>
      <p>HyperFrames cloud render works.</p>
    </div>
  </div>
</body>
</html>
